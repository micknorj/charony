name: Native icon toolchain investigation
on:
  push:
    branches: ['charony/icon-and-installation']
    paths: ['icons/AppIcon.icon/**', '.github/workflows/icon-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-icon:
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect and compile the native Icon Composer asset
        run: |
          set -euo pipefail
          mkdir -p .icon-results/compiled
          TOOL="${DEVELOPER_DIR%/Contents/Developer}/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          xcodebuild -version
          file "$TOOL"
          "$TOOL" --help 2>&1 | tee .icon-results/ictool-help.log
          xcrun actool icons/AppIcon.icon --compile .icon-results/compiled --platform iphoneos \
            --minimum-deployment-target 26.0 --target-device iphone --target-device ipad \
            --app-icon AppIcon --standalone-icon-behavior all \
            --output-partial-info-plist .icon-results/icon-info.plist --errors --warnings \
            --output-format human-readable-text 2>&1 | tee .icon-results/compile.log
          for RENDITION in Default Dark TintedLight TintedDark; do
            "$TOOL" icons/AppIcon.icon --export-image --output-file ".icon-results/$RENDITION.png" \
              --platform iOS --rendition "$RENDITION" --width 1024 --height 1024 --scale 1 --light-angle -45
          done
          "$TOOL" icons/AppIcon.icon --export-image --output-file .icon-results/tinted-color.png \
            --platform iOS --rendition TintedDark --width 1024 --height 1024 --scale 1 --tint-color 0.58 --tint-strength 0.7
          xcrun --find assetutil
          xcrun assetutil --info .icon-results/compiled/Assets.car > .icon-results/asset-info.json
      - name: Retain native tool evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-icon-toolchain-evidence
          path: .icon-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
